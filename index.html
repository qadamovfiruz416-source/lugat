:root{--bg:#fff;--card:#f5f8ff;--ink:#0f1b3d;--mute:#5a6785;--acc:#1d4ed8;--red:#dc2626;--accink:#fff;--line:#d6def5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1430;--card:#12204a;--ink:#f1f5ff;--mute:#9fb0d9;--acc:#6ea0ff;--red:#ff6b6b;--accink:#04122e;--line:#27396b}}
:root[data-theme="dark"]{--bg:#0b1430;--card:#12204a;--ink:#f1f5ff;--mute:#9fb0d9;--acc:#6ea0ff;--red:#ff6b6b;--accink:#04122e;--line:#27396b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
main::before{content:"";display:block;height:6px;border-radius:3px;margin-bottom:16px;background:linear-gradient(90deg,#1d4ed8,#dc2626)}
h1{font-size:1.8rem;margin:0 0 4px;letter-spacing:.04em;font-weight:800}.e{color:var(--acc)}.f{color:var(--red)}
p.sub{margin:0 0 16px;color:var(--mute);font-family:system-ui,sans-serif;font-size:.9rem}
input{width:100%;padding:14px;font-size:1.05rem;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:system-ui,sans-serif}
input:focus{outline:3px solid var(--acc);border-color:var(--acc)}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button,.add button{font:inherit;font-family:system-ui,sans-serif;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.w{flex:1;min-width:0}
.en{font-size:1.25rem;font-weight:700}
.tr{color:var(--red);font-family:system-ui,sans-serif;font-size:1rem}
.tg{font-size:1.1rem}
.spk{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:1.3rem;cursor:pointer}
.spk:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.add{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:8px}
.add h2{font-size:1.1rem;margin:0}
.empty{color:var(--mute);font-family:system-ui,sans-serif;padding:12px}
.note{color:var(--mute);font-family:system-ui,sans-serif;font-size:.85rem;margin-top:8px}
</style>
</head>

<main>
<h1><span class="e">ENGLISH</span> <span class="f">FIRUZ</span></h1>
<p class="sub">Калимаро ҷустуҷӯ кунед ва тугмаи 🔊-ро пахш кунед, то талаффузро бишнавед.</p>
<input id="q" type="search" placeholder="Ҷустуҷӯ: hello ё салом" autocomplete="off">
<div class="tabs">
<button id="t1" aria-pressed="true">Ҳама калимаҳо</button>
<button id="t2" aria-pressed="false">Калимаҳои ман</button>
</div>
<ul id="list"></ul>
<form class="add" id="f" onsubmit="return false">
<h2>Калимаи нав илова кунед</h2>
<input id="ne" placeholder="Англисӣ (масалан: apple)">
<input id="nt" placeholder="Талаффуз (масалан: эпл)">
<input id="ng" placeholder="Тоҷикӣ (масалан: себ)">
<button id="ab" type="button">Илова кардан</button>
<p class="note" id="nv"></p>
</form>
</main>

var mine=[],mode="all",q=document.getElementById("q"),list=document.getElementById("list");
try{mine=JSON.parse(localStorage.getItem("mine")||"[]")}catch(e){mine=[]}
function speak(t){
 try{var s=window.speechSynthesis;if(!s){alert("Браузери шумо талаффузро дастгирӣ намекунад.");return}
 s.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.85;s.speak(u)}catch(e){}
}
function esc(x){return x.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
 var src=mode==="all"?BASE.concat(mine):mine,k=q.value.trim().toLowerCase();
 var r=src.filter(function(w){return !k||w[0].toLowerCase().indexOf(k)>-1||w[2].toLowerCase().indexOf(k)>-1||w[1].toLowerCase().indexOf(k)>-1});
 if(!r.length){list.innerHTML='<li class="empty">Калима ёфт нашуд. Онро дар поён илова кунед.</li>';return}
 list.innerHTML=r.map(function(w,i){return '<li><div class="w"><div><span class="en">'+esc(w[0])+'</span> <span class="tr">['+esc(w[1])+']</span></div><div class="tg">— '+esc(w[2])+'</div></div><button class="spk" data-w="'+esc(w[0])+'" aria-label="Талаффуз: '+esc(w[0])+'">🔊</button></li>'}).join("");
}
list.addEventListener("click",function(e){var b=e.target.closest(".spk");if(b)speak(b.getAttribute("data-w"))});
q.addEventListener("input",render);
function tab(m){mode=m;document.getElementById("t1").setAttribute("aria-pressed",m==="all");document.getElementById("t2").setAttribute("aria-pressed",m==="mine");render()}
document.getElementById("t1").onclick=function(){tab("all")};
document.getElementById("t2").onclick=function(){tab("mine")};
document.getElementById("ab").onclick=function(){
 var a=document.getElementById("ne").value.trim(),b=document.getElementById("nt").value.trim(),c=document.getElementById("ng").value.trim(),n=document.getElementById("nv");
 if(!a||!c){n.textContent="Англисӣ ва тоҷикиро нависед.";return}
 mine.push([a,b||"—",c]);
 try{localStorage.setItem("mine",JSON.stringify(mine))}catch(e){}
 ["ne","nt","ng"].forEach(function(id){document.getElementById(id).value=""});
 n.textContent="Илова шуд!";render();
};
render();
